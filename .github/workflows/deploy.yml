name: Deploy do GitHub Pages

# Buduje stronę (Vite) i publikuje ją na GitHub Pages.
# Po pierwszym uruchomieniu wejdź w: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/tender-curie-9lvb3i
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kolejkuj deploye (nie anuluj w trakcie) — zapobiega błędowi
# "in progress deployment" przy szybkich kolejnych pushach.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      # SPA fallback (404 -> ta sama strona) + wyłączenie Jekyll na Pages
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
