<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Lodziarnia Pistacja — świeże lody, gofry i kawa w trzech budkach w Łodzi (Radogoszcz, Łagiewniki, Retkinia). Sprawdź, która jest teraz otwarta i wyznacz trasę."
    />
    <title>Lodziarnia Pistacja — świeże lody w trzech miejscach w Łodzi</title>

    <!-- Fonty: font-display swap (brak FOIT, mniejszy layout shift) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Auto-naprawa białego ekranu po nowej publikacji.
      Gdy przeglądarka ma w cache stary index.html wskazujący na nieistniejący
      już plik JS (po deployu hash się zmienia), aplikacja się nie montuje.
      Jeśli po kilku sekundach #root jest pusty, przeładuj RAZ z pominięciem cache.
    -->
    <script>
      (function () {
        setTimeout(function () {
          var root = document.getElementById("root");
          var mounted = window.__APP_MOUNTED__ === true;
          if (!mounted && root && root.childElementCount === 0) {
            if (!sessionStorage.getItem("pistacja_reloaded")) {
              sessionStorage.setItem("pistacja_reloaded", "1");
              location.reload();
            }
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
